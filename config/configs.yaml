llm_doc:
  base_url: https://api.deepseek.com
  api_key: sk-9f286133ee1c4b4bbd4be76711580b02
  model: deepseek-v4-flash
  async_sem: 512

llm_fuzz:
  base_url: none
  api_key: ${VOLTRON_LLM_FUZZ_API_KEY}
  model: none
  async_sem: 8

llm_compliance:
  base_url: none
  api_key: ${VOLTRON_LLM_COMPLIANCE_API_KEY}
  model: none
  async_sem: 8

# Per fuzzing iteration, evolve at most 25% of the request types.  The
# llm_fuzz async_sem remains an independent upper bound on concurrent calls.
fuzzing:
  mutator_round_ratio: 0.25
  # After 24 LLM mutation attempts, keep fuzzing with the latest validated
  # mutators.  Set to 0 only for an explicitly unlimited experiment.
  mutator_round_limit: 24
  offline_mutation:
    enabled: true
    probability: 0.3
    max_mutated_packets_per_sequence: 3
    max_mutations_per_packet: 4
    max_delta_bytes: 4
    # Absolute cap for all offline mutations.  length_extreme chooses either
    # one byte or extreme_message_length and bypasses max_delta_bytes.
    max_message_length: 65536
    extreme_message_length: 4096
    seed: 0
    mutate_imported_seeds: true
    protected_types: []

generated_code:
  # Retry initial generator/parser/checker/observer synthesis up to five
  # attempts before failing the component initialization.
  retry_limit: 5
  timeout_seconds: 2.0
  ir_generation_timeout_seconds: 300.0
  max_message_bytes: 1048576
  response_max_chars: 100000

# Generate one protocol-wide checker/observer before fuzzing, then create
# exact and response-family components in the background as types are seen.
response_components:
  lazy_generation: true
  prewarm_types: []
